name: Deploy Green Container

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Project slug to deploy
        required: true
        type: string
      generated_image_tag:
        description: Docker image tag for this deploy (e.g. gen-1)
        required: true
        type: string
      branch:
        description: Branch to deploy
        required: false
        default: main
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}
      repo_lower: ${{ steps.repo.outputs.REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set lowercase owner
        id: repo
        run: echo "REPO=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate tag
        id: vars
        run: |
          echo "TAG=${{ inputs.generated_image_tag }}" >> $GITHUB_OUTPUT

      - name: Clone project repo
        run: |
          git clone --branch "${{ inputs.branch }}" \
            "https://github.com/${{ github.repository_owner }}/${{ inputs.project_slug }}.git" \
            ./project

      - name: Build & Push platform image
        run: |
          docker buildx build \
            --cache-from=type=gha,scope=platform \
            --cache-to=type=gha,mode=max,scope=platform \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-platform:${{ steps.vars.outputs.TAG }} \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-platform:latest \
            --push \
            ./project

      - name: Build & Push background-worker image
        run: |
          docker buildx build \
            --cache-from=type=gha,scope=worker \
            --cache-to=type=gha,mode=max,scope=worker \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-background-worker:${{ steps.vars.outputs.TAG }} \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-background-worker:latest \
            --push \
            ./project

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          source: ".github/scripts/*"
          target: "/tmp/v7ai-scripts"
          strip_components: 2

      - name: Deploy Green Container
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_JWT_PRIVATE_KEY: ${{ secrets.APP_JWT_PRIVATE_KEY }}
          APP_JWT_PUBLIC_KEY: ${{ secrets.APP_JWT_PUBLIC_KEY }}
          APP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.APP_BOOTSTRAP_ADMIN_EMAIL }}
          APP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.APP_BOOTSTRAP_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          envs: APP_JWT_PRIVATE_KEY,APP_JWT_PUBLIC_KEY,APP_BOOTSTRAP_ADMIN_EMAIL,APP_BOOTSTRAP_ADMIN_PASSWORD
          script: |
            set -e
            export PATH="/home/v7aisolution/.nvm/versions/node/v24.14.0/bin:$PATH"

            SCRIPTS="/tmp/v7ai-scripts"
            chmod +x "$SCRIPTS"/*.sh

            PROJECT_SLUG="${{ inputs.project_slug }}"
            IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            REPO="${{ needs.build.outputs.repo_lower }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            "$SCRIPTS/deploy-green.sh" \
              "$PROJECT_SLUG" \
              "$REPO" \
              "$IMAGE_TAG" \
              "$SCRIPTS"